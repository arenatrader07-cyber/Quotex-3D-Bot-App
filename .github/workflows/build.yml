name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Setup & Build
        run: |
          mkdir -p app/src/main/java/com/quotex/bot3d
          printf "pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}\ndependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}}\nrootProject.name='Quotex3DBot'\ninclude ':app'" > settings.gradle
          printf "plugins{id 'com.android.application' version '8.1.4' apply false;id 'org.jetbrains.kotlin.android' version '1.9.0' apply false}" > build.gradle
          printf "android.useAndroidX=true\nandroid.enableJetifier=true" > gradle.properties
          printf "plugins{id 'com.android.application';id 'org.jetbrains.kotlin.android'}\nandroid{namespace 'com.quotex.bot3d';compileSdk 34;defaultConfig{applicationId 'com.quotex.bot3d';minSdk 26;targetSdk 34;versionCode 1;versionName '1.0'};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget='17'}}\ndependencies{implementation 'androidx.core:core-ktx:1.12.0';implementation 'androidx.appcompat:appcompat:1.6.1';implementation 'com.squareup.okhttp3:okhttp:4.12.0'}" > app/build.gradle
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Quotex-3D-Bot
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
