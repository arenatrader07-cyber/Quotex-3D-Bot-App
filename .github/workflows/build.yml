name: Build Quotex Bot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Generate Clean Manifest
        run: |
          python3 -c '
          p = "http" + "://://android.com"
          xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="{p}">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <application
                  android:allowBackup="true"
                  android:label="Quotex 3D Bot"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name="com.quotex.bot3d.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name="com.quotex.bot3d.FloatingBotService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          '
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quotex-3D-Bot
          path: app/build/outputs/apk/debug/app-debug.apk
