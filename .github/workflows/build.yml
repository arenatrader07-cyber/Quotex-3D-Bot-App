name: Build Quotex Bot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build Full Project
        run: |
          mkdir -p app/src/main/java/com/quotex/bot3d
          python3 -c 'import base64; open("settings.gradle", "wb").write(base64.b64decode(""))'
          python3 -c 'import base64; open("build.gradle", "wb").write(base64.b64decode("cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMS40JyBhcHBseSBmYWxzZQogICAgaWQgJ29yZy5qZXRicmFpbnMua290bGluLmFuZHJvaWQnIHZlcnNpb24gJzEuOS4wJyBhcHBseSBmYWxzZQp9Cg=="))'
          python3 -c 'import base64; open("gradle.properties", "wb").write(base64.b64decode("YW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQuZW5hYmxlSmV0aWZpZXI9dHJ1ZQo="))'
          python3 -c 'import base64; open("app/build.gradle", "wb").write(base64.b64decode(""))'
          python3 -c 'import base64; open("app/src/main/AndroidManifest.xml", "wb").write(base64.b64decode(""))'
          python3 -c 'import base64; open("app/src/main/java/com/quotex/bot3d/MainActivity.kt", "wb").write(base64.b64decode(""))'
