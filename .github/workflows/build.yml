name: Build Quotex 3D APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build App
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/quotex/bot3d

          python3 -c '
          open("settings.gradle", "w").write("pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}\ndependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}}\nrootProject.name=\"Quotex3DBot\"\ninclude \":app\"")
          open("build.gradle", "w").write("plugins{id \"com.android.application\" version \"8.1.4\" apply false;id \"org.jetbrains.kotlin.android\" version \"1.9.0\" apply false}")
          open("gradle.properties", "w").write("android.useAndroidX=true\nandroid.enableJetifier=true")
          open("app/build.gradle", "w").write("plugins{id \"com.android.application\";id \"org.jetbrains.kotlin.android\"}\nandroid{namespace \"com.quotex.bot3d\";compileSdk 34;defaultConfig{applicationId \"com.quotex.bot3d\";minSdk 26;targetSdk 34;versionCode 1;versionName \"1.0\"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget=\"17\"}}\ndependencies{implementation \"androidx.core:core-ktx:1.12.0\";implementation \"androidx.appcompat:appcompat:1.6.1\";implementation \"com.squareup.okhttp3:okhttp:4.12.0\"}")
          ns = "http" + "://://android.com"
          open("app/src/main/AndroidManifest.xml", "w").write(f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="{ns}">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <application android:allowBackup="true" android:label="Quotex 3D Bot" android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name="com.quotex.bot3d.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name="com.quotex.bot3d.FloatingBotService" android:enabled="true" android:exported="false" android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>""")
          '

          cat << 'EOF' > app/src/main/java/com/quotex/bot3d/MainActivity.kt
          package com.quotex.bot3d
          import android.app.Activity
          import android.content.*
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val l = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(50, 100, 50, 50); setBackgroundColor(android.graphics.Color.parseColor("#0F172A")) }
                  val t = TextView(this).apply { text = "QUOTEX 3D AI BOT"; textSize = 24f; setTextColor(android.graphics.Color.WHITE); setPadding(0, 0, 0, 40) }
                  val btn = Button(this).apply {
                      text = "LAUNCH FLOATING 3D BOT"
                      setBackgroundColor(android.graphics.Color.parseColor("#10B981"))
                      setTextColor(android.graphics.Color.WHITE)
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              startActivityForResult(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")), 101)
                          } else {
                              val m = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                              startActivityForResult(m.createScreenCaptureIntent(), 102)
                          }
                      }
                  }
                  l.addView(t); l.addView(btn); setContentView(l)
              }
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 101 && Settings.canDrawOverlays(this)) {
                      val m = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(m.createScreenCaptureIntent(), 102)
                  } else if (req == 102 && res == Activity.RESULT_OK && data != null) {
                      startForegroundService(Intent(this, FloatingBotService::class.java).apply { putExtra("C", res); putExtra("D", data) })
                      moveTaskToBack(true)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/quotex/bot3d/FloatingBotService.kt
          package com.quotex.bot3d
          import android.app.*
          import android.content.*
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.hardware.display.*
          import android.media.ImageReader
          import android.media.projection.*
          import android.os.*
          import android.view.*
          import android.widget.*
          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaTypeOrNull
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONObject
          import java.io.*

          class FloatingBotService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var box: LinearLayout
              private lateinit var btn: TextView
              private lateinit var card: LinearLayout
              private lateinit var tvSig: TextView
              private lateinit var tvAcc: TextView
              private lateinit var tvMtg: TextView
              private var isOn = false
              private val url = "https://onrender.com"
              private val client = OkHttpClient()
              private val handler = Handler(Looper.getMainLooper())
              private var mp: MediaProjection? = null
              private var ir: ImageReader? = null

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val ch = NotificationChannel("BOT", "Bot", NotificationManager.IMPORTANCE_LOW)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  startForeground(1, Notification.Builder(this, "BOT").setContentTitle("Quotex 3D Bot").setSmallIcon(android.R.drawable.ic_dialog_info).build())

                  val code = intent?.getIntExtra("C", -1) ?: -1
                  val data: Intent? = intent?.getParcelableExtra("D")
                  if (code != -1 && data != null) {
                      mp = (getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager).getMediaProjection(code, data)
                      val m = resources.displayMetrics
                      ir = ImageReader.newInstance(m.widthPixels / 2, m.heightPixels / 2, PixelFormat.RGBA_8888, 2)
                      mp?.createVirtualDisplay("QX", m.widthPixels / 2, m.heightPixels / 2, m.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, ir?.surface, null, null)
                  }
                  setupUI()
                  return START_STICKY
              }

              private fun setupUI() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  box = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  val bg = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.parseColor("#EF4444")); setStroke(5, Color.WHITE) }
                  btn = TextView(this).apply { text = "OFF"; textSize = 14f; typeface = Typeface.DEFAULT_BOLD; setTextColor(Color.WHITE); gravity = Gravity.CENTER; background = bg; layoutParams = LinearLayout.LayoutParams(140, 140) }
                  val cBg = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; cornerRadius = 24f; setColor(Color.parseColor("#0F172A")); setStroke(5, Color.parseColor("#38BDF8")) }
                  card = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; background = cBg; elevation = 30f; setPadding(30, 20, 30, 20); visibility = View.GONE; layoutParams = LinearLayout.LayoutParams(-2, -2).apply { setMargins(16, 0, 0, 0) } }
                  tvSig = TextView(this).apply { text = "SCANNING..."; textSize = 18f; typeface = Typeface.DEFAULT_BOLD; setTextColor(Color.parseColor("#38BDF8")); gravity = Gravity.CENTER }
                  tvAcc = TextView(this).apply { text = "Win: --%"; textSize = 13f; setTextColor(Color.WHITE); gravity = Gravity.CENTER }
                  tvMtg = TextView(this).apply { text = "1-STEP MTG"; textSize = 11f; setTextColor(Color.parseColor("#FACC15")); gravity = Gravity.CENTER }
